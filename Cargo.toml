[package]
name = "xcx"
version = "1.2.0"
edition = "2024"
description = "XCX 1.2 historical reconstruction AOT compiler"
license = "Apache-2.0"
repository = "https://github.com/xcxlang-org/xcx-legacy"
build = "build.rs"

[lib]
name = "xcx"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "xcx-legacy"
path = "src/main.rs"

[dependencies]
cc = "1"
cranelift = "0.137.1"
cranelift-module = "0.137.1"
cranelift-native = "0.137.1"
cranelift-object = "0.137.1"
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
cc = "1"
